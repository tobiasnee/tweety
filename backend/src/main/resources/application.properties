spring.application.name=backend

# Datenbank
spring.datasource.url=jdbc:h2:file:./data/tweety
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2-Konsole
spring.h2.console.enabled=true

# Fachliche Konfiguration
app.max-tweet-length=280

# Nur zum Demonstrieren des Rollback-Verhaltens wenn man false/true tauscht (Story 14)
app.simulate-failure-after-tweet=false

# Actuator (Story 17)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=Tweety
info.app.description=Mini-Twitter Lernprojekt mit Spring Boot und Angular
info.app.version=1.0.0